<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELI5 links</title>
<style>
  :root{--ink:#2b2140; --soft:#6b6580; --card:#ffffff; --shadow:0 10px 30px rgba(70,50,120,.12)}
  *{box-sizing:border-box}
  body{
    margin:0; padding:28px 16px 64px;
    font-family:ui-rounded,"Segoe UI",Nunito,system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,#fff4e6 0%,#ffe9f3 45%,#e9f0ff 100%);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px; margin:0 auto}
  h1{font-size:32px; line-height:1.15; text-align:center; margin:8px 0 6px; font-weight:800; letter-spacing:-.5px}
  .sub{text-align:center; color:var(--soft); font-size:18px; margin:0 0 26px}
  a.card{display:block; text-decoration:none; color:inherit; background:var(--card); border-radius:26px; padding:22px 22px; box-shadow:var(--shadow); margin:14px 0; text-align:left; display:flex; align-items:center; gap:16px}
  a.card:active{transform:scale(.99)}
  .emoji{font-size:44px; line-height:1; flex:0 0 auto}
  .big{font-size:20px; font-weight:800; margin:0}
  .say{font-size:15px; color:var(--soft); margin:4px 0 0; line-height:1.4}
  .foot{text-align:center; color:var(--soft); font-size:14px; margin-top:26px}
</style>
</head>
<body>
<div class="wrap">

  <h1>ELI5 links &#128161;</h1>
  <p class="sub">tap any card to open it</p>

  <a class="card" href="greptile-tries-and-split.html">
    <span class="emoji">&#11088;</span>
    <span>
      <p class="big">How a PR gets its grade</p>
      <p class="say">try, try, chop &mdash; then your call</p>
    </span>
  </a>

  <a class="card" href="dms-goes-first.html">
    <span class="emoji">&#127869;&#65039;</span>
    <span>
      <p class="big">Why I test new rules on myself first</p>
      <p class="say">one plate before the whole party</p>
    </span>
  </a>

  <a class="card" href="where-eli5-pages-live.html">
    <span class="emoji">&#128241;</span>
    <span>
      <p class="big">Where should the pages live?</p>
      <p class="say">the honest answer for a phone reader</p>
    </span>
  </a>

  <p class="foot">more ELI5 pages will land here &#128054;</p>

</div>
</body>
</html>
